[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanjing-eeq"
version = "0.1.0"
description = "Code workflow for RGBN-based ecological environment quality estimation in Nanjing."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.1",
  "xgboost>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
